    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Decorative circles -->
  <circle cx="1000" cy="150" r="200" fill="#4F46E5" opacity="0.08"/>
  <circle cx="200" cy="500" r="150" fill="#7C3AED" opacity="0.06"/>
  <circle cx="1100" cy="450" r="100" fill="#4F46E5" opacity="0.05"/>

  <!-- Logo area -->
  <rect x="80" y="100" width="48" height="48" rx="12" fill="#4F46E5"/>
  <rect x="84" y="104" width="40" height="40" rx="9" fill="#6366F1"/>
  <text x="104" y="130" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">F</text>

