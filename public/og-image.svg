  <text x="100" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Maak en verstuur in 1 klik</text>

  <rect x="420" y="250" width="320" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="440" y="285" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">BTW &amp; bonnetjes</text>
  <text x="440" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Automatisch bijhouden</text>

  <rect x="760" y="250" width="320" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="780" y="285" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Bankkoppeling</text>
